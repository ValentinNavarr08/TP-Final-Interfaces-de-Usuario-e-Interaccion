<div class="card">
  <div class="card-media">
    <img [src]="item.posterUrl" [alt]="item.title" class="card-poster" loading="lazy" />

    @if (item.progress !== undefined) {
      <div class="progress-track">
        <div class="progress-fill" [style.width.%]="item.progress"></div>
      </div>
    }

    <div class="card-hover-panel">
      <div class="card-hover-tint"></div>

      <span class="card-hover-title">{{ item.title }}</span>

      <div class="card-hover-actions">
        <button class="card-play-btn" aria-label="Reproducir">
          <svg width="24" height="24" viewBox="0 0 54 60" fill="none">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M43.1041 21.7492L16.6429 5.64222C12.2128 2.94726 6.69995 6.35687 6.69995 11.7822V43.9946C6.69995 49.427 12.2128 52.8296 16.6429 50.1347L43.1041 34.0357C47.5674 31.3196 47.5674 24.4654 43.1041 21.7492Z" fill="currentColor"/>
            <path d="M7.44995 11.7822C7.44995 6.85671 12.3936 3.93581 16.2527 6.2832L42.7146 22.3896C46.6975 24.8136 46.6972 30.9704 42.7146 33.3945L16.2527 49.4941C12.3932 51.8416 7.45027 48.9266 7.44995 43.9951V11.7822Z" stroke="white" stroke-opacity="0.45" stroke-width="1.5"/>
          </svg>
        </button>

        <button
          class="card-round-btn"
          [class.active]="isLiked"
          (click)="toggleLike($event)"
          aria-label="Me gusta"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" [attr.fill]="isLiked ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
            <path d="M12 21s-6.7-4.35-9.3-8.14C1.02 10.6 1.6 7.36 4.2 5.86c2.1-1.22 4.7-.6 6 1.2l1.8 2.5 1.8-2.5c1.3-1.8 3.9-2.42 6-1.2 2.6 1.5 3.18 4.74 1.5 7-2.6 3.79-9.3 8.14-9.3 8.14z"/>
          </svg>
        </button>

        <button class="card-round-btn" aria-label="Notificarme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
