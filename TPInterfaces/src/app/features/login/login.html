<div class="page-background">
  <img class="hero-image" src="resources/image.png" alt="Fondo de inicio de sesión" />
  <div class="page-glow-primary"></div>
  <div class="page-glow-secondary"></div>
</div>

<main class="login-container">
  <div class="login-card">
    <div class="login-logo">
  <img src="resources/logo-form.png" alt="Netflics" class="logo-image" />
</div>
    
<div class="form-separator"></div>

<form class="login-form" (ngSubmit)="onSubmit()">
  <div class="form-field">
    <label for="email">Email</label>
    <input type="email" id="email" [(ngModel)]="email" name="email" required />
  </div>

  <div class="form-field">
    <label for="password">Contraseña</label>
    <input type="password" id="password" [(ngModel)]="password" name="password" required />
    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
  </div>

  <button type="submit" class="btn-primary">Ingresar</button>

  <div class="form-separator"></div>    

      <button type="button" class="btn-google">
        Ingresar con Google
        <span class="google-icon">G</span>
      </button>

      <a href="#" class="no-account-link">No tengo cuenta</a>
    </form>
  </div>
</main>
<app-footer></app-footer>
