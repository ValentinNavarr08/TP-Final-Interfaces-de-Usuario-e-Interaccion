<div class="page-background">
  <img class="hero-image" src="resources/image.png" alt="Fondo de inicio de sesión" />
  <div class="page-glow-primary"></div>
  <div class="page-glow-secondary"></div>
</div>

<main class="login-container">
  <div class="login-card" [class.shake]="shake">
    <div class="login-logo">
      <img src="resources/logo-form.png" alt="Netflics" class="logo-image" />
    </div>

    <div class="form-separator"></div>

    <form class="login-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field" [class.has-error]="emailTouched && emailError">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          (blur)="onEmailBlur()"
          (input)="onEmailInput()"
          [attr.aria-invalid]="emailTouched && emailError ? 'true' : null"
          [attr.aria-describedby]="emailTouched && emailError ? 'email-error' : null"
        />
        @if (emailTouched && emailError) {
          <span class="field-error" id="email-error">{{ emailError }}</span>
        }
      </div>

      <div class="form-field" [class.has-error]="passwordTouched && passwordError">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          (blur)="onPasswordBlur()"
          (input)="onPasswordInput()"
          [attr.aria-invalid]="passwordTouched && passwordError ? 'true' : null"
          [attr.aria-describedby]="passwordTouched && passwordError ? 'password-error' : null"
        />
        @if (passwordTouched && passwordError) {
          <span class="field-error" id="password-error">{{ passwordError }}</span>
        }
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      @if (formError) {
        <div class="form-error" role="alert">{{ formError }}</div>
      }

      <button (click)="onSubmit()" type="submit" class="btn-primary">Ingresar</button>

      <div class="form-separator"></div>

      <button type="button" class="btn-google">
        Ingresar con Google
        <span class="google-icon">G</span>
      </button>

      <a href="#" class="no-account-link">No tengo cuenta</a>
    </form>
  </div>
</main>

<app-footer></app-footer>
